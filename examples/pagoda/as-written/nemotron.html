<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Pagoda Garden</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
        h1 { margin: 0 0 10px 0; font-size: 24px; color: #FFD54F; }
        p { margin: 5px 0; font-size: 14px; line-height: 1.6; }
        .control { margin-top: 10px; }
        button {
            background: #FFD54F;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: #333;
        }
        button:hover { background: #FFEE76; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Voxel Pagoda Garden</h1>
        <p>Explore a colorful voxel world with a traditional pagoda,<br>cherry blossoms, and a peaceful garden.</p>
        <div class="control">
            <button onclick="regenerateScene()">Generate New Garden</button>
        </div>
        <p style="font-size: 12px; opacity: 0.8;">Click and drag to rotate • Scroll to zoom</p>
    </div>

    <!-- Load Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script>

    <script>
        /**
         * VOXEL ENGINE & SCENE GENERATOR
         * A self-contained voxel rendering system using Three.js InstancedMesh
         */
        
        // Configuration
        const CONFIG = {
            groundSize: 50,
            voxelSize: 1,
            maxVoxels: 15000,
            colors: {
                grass: '#4CAF50',
                grassDark: '#2E7D32',
                dirt: '#8B5A2B',
                path: '#9D734A',
                pathLight: '#D7B483',
                water: '#2196F3',
                waterDeep: '#0D47A1',
                sand: '#F9A825',
                cherryBlossom: '#F48FB1',
                cherryBlossomDark: '#E1BE7D',
                leafGreen: '#8BC34A',
                leafDark: '#43A047',
                trunk: '#5D4037',
                trunkDark: '#3E2723',
                pagodaBase: '#5D4037',
                pagodaWall: '#7B5C57',
                pagodaEave: '#3E2723',
                pagodaRoof: '#C62828',
                lantern: '#FFEB3B',
                lanternGlass: '#FFD54F',
                flower: '#FF4081',
                flowerDark: '#C2185B'
            }
        };

        // Voxel data structure
        let voxels = [];
        let scene, camera, renderer, controls, mesh;
        let material;

        // Utility functions
        function randomRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        function randomInt(min, max) {
            return Math.floor(randomRange(min, max + 1));
        }

        function hexToRGB(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? [
                parseInt(result[1], 16) / 255,
                parseInt(result[2], 16) / 255,
                parseInt(result[3], 16) / 255
            ] : [1, 1, 1];
        }

        // Core voxel operations
        function addVoxel(list, x, y, z, colorHex) {
            list.push({ x, y, z, color: colorHex });
        }

        function addBlock(list, x0, y0, z0, size, colorHex) {
            for (let x = x0; x < x0 + size; x++) {
                for (let y = y0; y < y0 + size; y++) {
                    for (let z = z0; z < z0 + size; z++) {
                        addVoxel(list, x, y, z, colorHex);
                    }
                }
            }
        }

        function addFrame(list, x0, y0, z0, size, colorHex) {
            // Top and bottom edges
            for (let x = x0; x < x0 + size; x++) {
                addVoxel(list, x, y0, z0, colorHex);
                addVoxel(list, x, y0, z0 + size - 1, colorHex);
            }
            // Left and right edges (skip corners already added)
            for (let z = z0 + 1; z < z0 + size - 1; z++) {
                addVoxel(list, x0, y0, z, colorHex);
                addVoxel(list, x0 + size - 1, y0, z, colorHex);
            }
        }

        function addSphere(list, cx, cy, cz, radius, colorHex) {
            const r2 = radius * radius;
            for (let x = cx - radius; x <= cx + radius; x++) {
                for (let y = cy - radius; y <= cy + radius; y++) {
                    for (let z = cz - radius; z <= cz + radius; z++) {
                        const dx = x - cx;
                        const dy = y - cy;
                        const dz = z - cz;
                        if (dx*dx + dy*dy + dz*dz <= r2) {
                            addVoxel(list, x, y, z, colorHex);
                        }
                    }
                }
            }
        }

        function addEllipsoid(list, cx, cy, cz, rx, ry, rz, colorHex) {
            for (let x = cx - rx; x <= cx + rx; x++) {
                for (let y = cy - ry; y <= cy + ry; y++) {
                    for (let z = cz - rz; z <= cz + rz; z++) {
                        const dx = x - cx;
                        const dy = y - cy;
                        const dz = z - cz;
                        if ((dx*dx)/(rx*rx) + (dy*dy)/(ry*ry) + (dz*dz)/(rz*rz) <= 1) {
                            addVoxel(list, x, y, z, colorHex);
                        }
                    }
                }
            }
        }

        // Scene generation
        function generateScene() {
            voxels = [];

            // 1. GROUND LAYER
            const gs = CONFIG.groundSize;
            for (let x = -gs/2; x < gs/2; x++) {
                for (let z = -gs/2; z < gs/2; z++) {
                    // Random grass/dirt mix
                    const r = Math.random();
                    if (r > 0.9) {
                        addVoxel(voxels, x, 0, z, CONFIG.colors.dirt);
                    } else if (r > 0.7) {
                        addVoxel(voxels, x, 0, z, CONFIG.colors.grassDark);
                    } else {
                        addVoxel(voxels, x, 0, z, CONFIG.colors.grass);
                    }
                }
            }

            // 2. POND (back center)
            const pondCenterZ = 25;
            const pondRadiusX = 12;
            const pondRadiusZ = 10;
            for (let x = -pondRadiusX; x <= pondRadiusX; x++) {
                for (let z = pondCenterZ - pondRadiusZ; z <= pondCenterZ + pondRadiusZ; z++) {
                    const dx = x;
                    const dz = z - pondCenterZ;
                    if ((dx*dx)/(pondRadiusX*pondRadiusX) + (dz*dz)/(pondRadiusZ*pondRadiusZ) <= 1) {
                        // Water surface
                        addVoxel(voxels, x, 0, z, CONFIG.colors.water);
                        // Some deeper water patches
                        if (Math.random() > 0.8) {
                            addVoxel(voxels, x, -1, z, CONFIG.colors.waterDeep);
                        }
                    }
                }
            }

            // 3. SAND BEACH AROUND POND
            for (let x = -pondRadiusX - 2; x <= pondRadiusX + 2; x++) {
                for (let z = pondCenterZ - pondRadiusZ - 2; z <= pondCenterZ + pondRadiusZ + 2; z++) {
                    const dx = x;
                    const dz = z - pondCenterZ;
                    const dist = Math.sqrt((dx*dx)/(pondRadiusX*pondRadiusX) + (dz*dz)/(pondRadiusZ*pondRadiusZ));
                    if (dist > 1 && dist <= 1.5 && voxels.filter(v => v.x === x && v.y === 0 && v.z === z).length === 0) {
                        addVoxel(voxels, x, 0, z, CONFIG.colors.sand);
                    }
                }
            }

            // 4. PATH (winding from front to center)
            let pathX = -2;
            for (let z = -25; z < 20; z += 3) {
                // Add path segment
                for (let px = -1; px <= 1; px++) {
                    for (let pz = -1; pz <= 1; pz++) {
                        const tx = pathX + px;
                        const tz = z + pz;
                        // Don't overwrite pond
                        const pondDx = tx;
                        const pondDz = tz - pondCenterZ;
                        const inPond = (pondDx*pondDx)/(pondRadiusX*pondRadiusX) + (pondDz*pondDz)/(pondRadiusZ*pondRadiusZ) <= 1;
                        if (!inPond) {
                            addVoxel(voxels, tx, 0, tz, CONFIG.colors.path);
                            // Add grass border
                            if (Math.random() > 0.7) {
                                addVoxel(voxels, tx + 2, 0, tz, CONFIG.colors.grass);
                                addVoxel(voxels, tx - 2, 0, tz, CONFIG.colors.grass);
                            }
                        }
                    }
                }
                // Random walk path
                pathX += randomInt(-1, 1);
                pathX = Math.max(-8, Math.min(8, pathX));
            }

            // 5. FLOWERS
            for (let i = 0; i < 60; i++) {
                const fx = randomInt(-gs/2 + 2, gs/2 - 2);
                const fz = randomInt(-gs/2 + 2, gs/2 - 2);
                // Don't place on path or pond
                const isPath = (Math.abs(fx - pathX) < 2 && Math.abs(fz - (z)) < 2);
                const pondDx = fx;
                const pondDz = fz - pondCenterZ;
                const inPond = (pondDx*pondDx)/(pondRadiusX*pondRadiusX) + (pondDz*pondDz)/(pondRadiusZ*pondRadiusZ) <= 1.5;
                if (!isPath && !inPond) {
                    addVoxel(voxels, fx, 0, fz, Math.random() > 0.5 ? CONFIG.colors.flower : CONFIG.colors.flowerDark);
                }
            }

            // 6. TREES
            const treePositions = [
                { x: -20, z: -20, type: 'conifer' },
                { x: 20, z: -20, type: 'cherry' },
                { x: -15, z: 15, type: 'conifer' },
                { x: 15, z: 15, type: 'cherry' },
                { x: -25, z: 0, type: 'conifer' },
                { x: 25, z: 0, type: 'cherry' },
                { x: -8, z: 22, type: 'conifer' },
                { x: 8, z: 22, type: 'cherry' }
            ];

            treePositions.forEach(pos => {
                const trunkHeight = randomInt(6, 10);
                const foliageRadius = randomInt(3, 5);
                
                if (pos.type === 'cherry') {
                    // Cherry blossom tree
                    // Trunk
                    for (let y = 0; y < trunkHeight; y++) {
                        addVoxel(voxels, pos.x, y, pos.z, CONFIG.colors.trunk);
                        addVoxel(voxels, pos.x + 1, y, pos.z, CONFIG.colors.trunk);
                        addVoxel(voxels, pos.x, y, pos.z + 1, CONFIG.colors.trunk);
                        addVoxel(voxels, pos.x + 1, y, pos.z + 1, CONFIG.colors.trunk);
                    }
                    // Pink foliage
                    addSphere(voxels, pos.x + 0.5, trunkHeight, pos.z + 0.5, foliageRadius, CONFIG.colors.cherryBlossom);
                    addSphere(voxels, pos.x + 0.5, trunkHeight + 2, pos.z + 0.5, foliageRadius - 1, CONFIG.colors.cherryBlossomDark);
                    // Fallen petals
                    for (let i = 0; i < 10; i++) {
                        const px = pos.x + randomInt(-4, 4);
                        const py = randomInt(0, 2);
                        const pz = pos.z + randomInt(-4, 4);
                        addVoxel(voxels, px, py, pz, CONFIG.colors.cherryBlossom);
                    }
                } else {
                    // Coniferous tree (green pine)
                    for (let y = 0; y < trunkHeight; y++) {
                        addVoxel(voxels, pos.x, y, pos.z, CONFIG.colors.trunk);
                        addVoxel(voxels, pos.x + 1, y, pos.z, CONFIG.colors.trunkDark);
                        addVoxel(voxels, pos.x, y, pos.z + 1, CONFIG.colors.trunkDark);
                    }
                    // Green foliage layers
                    for (let layer = 0; layer < 3; layer++) {
                        const layerRadius = foliageRadius - layer;
                        const layerY = trunkHeight + layer;
                        addSphere(voxels, pos.x + 0.5, layerY, pos.z + 0.5, layerRadius, CONFIG.colors.leafGreen);
                        if (layer > 0) {
                            addSphere(voxels, pos.x + 0.5, layerY, pos.z + 0.5, layerRadius - 1, CONFIG.colors.leafDark);
                        }
                    }
                }
            });

            // 7. PAGODA (center)
            const P = CONFIG.colors;
            const baseSize = 14;
            const baseY = 0;
            const baseH = 3;

            // Base platform
            addBlock(voxels, -baseSize/2, baseY, -baseSize/2, baseSize, P.pagodaBase);

            // Story 1
            const s1Size = 10;
            const s1Y = baseY + baseH;
            const s1H = 3;
            addBlock(voxels, -s1Size/2, s1Y, -s1Size/2, s1Size, P.pagodaWall);
            // Eave 1
            addFrame(voxels, -s1Size/2 - 1, s1Y + s1H, -s1Size/2 - 1, s1Size + 2, P.pagodaEave);

            // Story 2
            const s2Size = 8;
            const s2Y = s1Y + s1H + 1;
            const s2H = 3;
            addBlock(voxels, -s2Size/2, s2Y, -s2Size/2, s2Size, P.pagodaWall);
            // Eave 2
            addFrame(voxels, -s2Size/2 - 1, s2Y + s2H, -s2Size/2 - 1, s2Size + 2, P.pagodaEave);

            // Story 3
            const s3Size = 6;
            const s3Y = s2Y + s2H + 1;
            const s3H = 3;
            addBlock(voxels, -s3Size/2, s3Y, -s3Size/2, s3Size, P.pagodaWall);
            // Eave 3
            addFrame(voxels, -s3Size/2 - 1, s3Y + s3H, -s3Size/2 - 1, s3Size + 2, P.pagodaEave);

            // Story 4 (top)
            const s4Size = 4;
            const s4Y = s3Y + s3H + 1;
            const s4H = 2;
            addBlock(voxels, -s4Size/2, s4Y, -s4Size/2, s4Size, P.pagodaWall);
            // Eave 4
            addFrame(voxels, -s4Size/2 - 1, s4Y + s4H, -s4Size/2 - 1, s4Size + 2, P.pagodaEave);

            // Roof
            const roofSize = 6;
            const roofY = s4Y + s4H + 1;
            addBlock(voxels, -roofSize/2, roofY, -roofSize/2, roofSize, P.pagodaRoof);
            // Roof tier 2
            addBlock(voxels, -2, roofY + 1, -2, 4, P.pagodaRoof);
            // Roof peak
            addVoxel(voxels, 0, roofY + 3, 0, P.pagodaRoof);

            // Lanterns on pagoda
            addVoxel(voxels, -5, s1Y + s1H, -5, P.lantern);
            addVoxel(voxels, 5, s1Y + s1H, -5, P.lantern);
            addVoxel(voxels, -5, s1Y + s1H, 5, P.lantern);
            addVoxel(voxels, 5, s1Y + s1H, 5, P.lantern);
            addVoxel(voxels, -5, s2Y + s2H, -5, P.lanternGlass);
            addVoxel(voxels, 5, s2Y + s2H, -5, P.lanternGlass);
            addVoxel(voxels, -5, s2Y + s2H, 5, P.lanternGlass);
            addVoxel(voxels, 5, s2Y + s2H, 5, P.lanternGlass);

            // 8. DECORATIVE ROCKS & BUSHES
            for (let i = 0; i < 30; i++) {
                const rx = randomInt(-gs/2 + 2, gs/2 - 2);
                const rz = randomInt(-gs/2 + 2, gs/2 - 2);
                // Avoid path and pond
                const pondDx = rx;
                const pondDz = rz - pondCenterZ;
                const inPond = (pondDx*pondDx)/(pondRadiusX*pondRadiusX) + (pondDz*pondDz)/(pondRadiusZ*pondRadiusZ) <= 2;
                if (!inPond) {
                    addVoxel(voxels, rx, 0, rz, CONFIG.colors.dirt);
                    if (Math.random() > 0.7) addVoxel(voxels, rx, 1, rz, CONFIG.colors.grassDark);
                }
            }

            // 9. BRIDGE OVER POND
            // Simple arched bridge from left to right across pond
            const bridgeY = 1;
            for (let x = -15; x <= 15; x++) {
                const bridgeZ = pondCenterZ - 2;
                // Don't overwrite existing voxels
                const existing = voxels.some(v => v.x === x && v.y === bridgeY && v.z === bridgeZ);
                if (!existing) {
                    addVoxel(voxels, x, bridgeY, bridgeZ, CONFIG.colors.path);
                    // Add railing
                    addVoxel(voxels, x, bridgeY + 1, bridgeZ, CONFIG.colors.pagodaEave);
                    addVoxel(voxels, x, bridgeY + 1, bridgeZ + 1, CONFIG.colors.pagodaEave);
                }
            }

            return voxels;
        }

        // Rendering system
        function initRenderer(voxelList) {
            // Clean up previous scene
            if (scene) {
                scene = null;
                renderer = null;
                controls = null;
                if (mesh) mesh.geometry.dispose();
            }

            // Setup scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky blue
            scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(50, 40, 50);
            camera.lookAt(0, 10, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 120;
            controls.minDistance = 10;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xFFFFFF, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xFFFFFF, 0.8);
            dirLight.position.set(50, 100, 50);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.left = -60;
            dirLight.shadow.camera.right = 60;
            dirLight.shadow.camera.top = 60;
            dirLight.shadow.camera.bottom = -60;
            dirLight.shadow.camera.near = 0.1;
            dirLight.shadow.camera.far = 200;
            dirLight.shadow.bias = -0.0001;
            scene.add(dirLight);

            // Voxel material shader
            const vertexShader = `
                attribute vec3 instanceColor;
                attribute mat4 instanceMatrix;
                varying vec3 vNormal;
                varying vec3 vColor;

                void main() {
                    vec4 position = instanceMatrix * vec4(position, 1.0);
                    gl_Position = projectionMatrix * modelViewMatrix * position;
                    
                    vec3 normal = normalize((instanceMatrix * vec4(normal, 0.0)).xyz);
                    vNormal = normal;
                    vColor = instanceColor;
                }
            `;

            const fragmentShader = `
                varying vec3 vNormal;
                varying vec3 vColor;

                void main() {
                    vec3 lightDir = normalize(vec3(0.5, 1.0, 0.5));
                    float diff = max(dot(vNormal, lightDir), 0.3);
                    vec3 color = vColor * diff;
                    // Add slight ambient
                    color += vColor * 0.3;
                    gl_FragColor = vec4(color, 1.0);
                }
            `;

            material = new THREE.ShaderMaterial({
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                attributes: {
                    instanceColor: { value: null }
                }
            });

            // Create instanced mesh
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const count = voxelList.length;
            mesh = new THREE.InstancedMesh(geometry, material, count);

            // Setup instance color buffer
            const instanceColor = new THREE.BufferAttribute(new Float32Array(count * 3), 3);
            const color = new THREE.Color();
            const matrix = new THREE.Matrix4();
            const dummy = new THREE.Object3D();

            for (let i = 0; i < count; i++) {
                const v = voxelList[i];
                color.setHex(v.color.replace('#', '0x'));
                instanceColor.setArray(i * 3, [color.r, color.g, color.b]);
                
                // Position matrix (center voxel at integer + 0.5)
                matrix.makeTranslation(v.x + 0.5, v.y + 0.5, v.z + 0.5);
                dummy.updateMatrix();
                // InstancedMesh handles instanceMatrix automatically
            }

            material.attributes.instanceColor.value = instanceColor;
            mesh.instanceCount = count;

            scene.add(mesh);

            // Initial render
            resizeRenderer();
            animate();
        }

        function resizeRenderer() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Initialize
        window.addEventListener('resize', resizeRenderer);
        window.addEventListener('load', () => {
            const voxelList = generateScene();
            initRenderer(voxelList);
        });

        function regenerateScene() {
            // Simple seed-based regeneration would be ideal, but for now just regenerate
            const voxelList = generateScene();
            initRenderer(voxelList);
        }
    </script>
</body>
</html>
