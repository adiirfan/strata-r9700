<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxel Pagoda Garden</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #171821;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
    }
    .overlay {
      position: fixed;
      left: 22px;
      top: 18px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.55);
      pointer-events: none;
      user-select: none;
    }
    .overlay h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .overlay p {
      margin: 8px 0 0;
      font-size: 13px;
      opacity: 0.8;
      letter-spacing: 0.04em;
    }
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 45%, transparent 55%, rgba(0,0,0,0.22) 100%);
    }
  </style>
</head>
<body>
  <div class="overlay">
    <h1>Voxel Pagoda Garden</h1>
    <p>Drag to orbit · Scroll to zoom · Cherry blossoms drift</p>
  </div>
  <div class="vignette"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ------------------------------------------------------------------
    // Renderer / scene / camera
    // ------------------------------------------------------------------
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9bd4f1);
    scene.fog = new THREE.Fog(0xb7d9ef, 20, 42);

    const camera = new THREE.PerspectiveCamera(
      42,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(14, 11.5, 18);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 4.2, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.minDistance = 7;
    controls.maxDistance = 38;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.22;
    controls.update();

    // ------------------------------------------------------------------
    // Lights
    // ------------------------------------------------------------------
    const hemi = new THREE.HemisphereLight(0xd8efff, 0x42633d, 0.85);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff2d4, 2.25);
    sun.position.set(-8, 15, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 42;
    sun.shadow.camera.left = -18;
    sun.shadow.camera.right = 18;
    sun.shadow.camera.top = 18;
    sun.shadow.camera.bottom = -18;
    sun.shadow.bias = -0.0005;
    scene.add(sun);

    const warmFill = new THREE.PointLight(0xffc27a, 12, 18, 1.6);
    warmFill.position.set(-4, 6, 7);
    scene.add(warmFill);

    const coolFill = new THREE.PointLight(0x83c8ff, 7, 22, 1.7);
    coolFill.position.set(7, 8, -5);
    scene.add(coolFill);

    // ------------------------------------------------------------------
    // Voxel helpers
    // ------------------------------------------------------------------
    const voxelGeometry = new THREE.BoxGeometry(1, 1, 1);
    const materialCache = new Map();

    function getMaterial(color, opts = {}) {
      const key = color + '|' + (opts.emissive ?? '') + '|' + (opts.roughness ?? 0.72) + '|' + (opts.metalness ?? 0.04);
      if (materialCache.has(key)) return materialCache.get(key);

      const material = new THREE.MeshStandardMaterial({
        color,
        roughness: opts.roughness ?? 0.72,
        metalness: opts.metalness ?? 0.04,
        emissive: opts.emissive ?? 0x000000,
        emissiveIntensity: opts.emissiveIntensity ?? 0
      });

      materialCache.set(key, material);
      return material;
    }

    const voxelBuckets = new Map();

    function addVoxel(x, y, z, sx, sy, sz, color, opts = {}) {
      const material = getMaterial(color, opts);
      if (!voxelBuckets.has(material)) voxelBuckets.set(material, []);

      voxelBuckets.get(material).push({
        x, y, z,
        sx, sy, sz,
        ry: opts.ry ?? 0
      });
    }

    function addBox(x, y, z, w, h, d, color, opts = {}) {
      addVoxel(x, y, z, w, h, d, color, opts);
    }

    function commitVoxels() {
      const q = new THREE.Quaternion();
      const p = new THREE.Vector3();
      const s = new THREE.Vector3();
      const matrix = new THREE.Matrix4();

      for (const [material, items] of voxelBuckets) {
        const mesh = new THREE.InstancedMesh(voxelGeometry, material, items.length);
        mesh.castShadow = true;
        mesh.receiveShadow = true;

        for (let i = 0; i < items.length; i++) {
          const item = items[i];
          p.set(item.x, item.y, item.z);
          q.setFromEuler(new THREE.Euler(0, item.ry, 0));
          s.set(item.sx, item.sy, item.sz);
          matrix.compose(p, q, s);
          mesh.setMatrixAt(i, matrix);
        }

        mesh.instanceMatrix.needsUpdate = true;
        scene.add(mesh);
      }
    }

    // ------------------------------------------------------------------
    // Palette
    // ------------------------------------------------------------------
    const PAL = {
      grass1: 0x4f8d45,
      grass2: 0x6aa84f,
      grass3: 0x84b85c,
      grass4: 0x3f7138,
      moss: 0x5b8a4f,
      dirt: 0x6b4d32,
      stone: 0x9a9b91,
      stoneDark: 0x6d716c,
      stoneLight: 0xc7c7bb,
      path: 0xb7ad9b,
      pathDark: 0x8c806e,
      water: 0x3f9fcf,
      waterLight: 0x6ec7e8,
      waterDeep: 0x247bb4,
      red: 0xc53b32,
      redDark: 0x8f2b27,
      cream: 0xf3e3bd,
      creamLight: 0xfff2cf,
      gold: 0xe9b94f,
      goldLight: 0xffd76a,
      roofGreen: 0x2a7b67,
      roofLight: 0x3d9b83,
      roofDark: 0x1d5d50,
      roofTeal: 0x265f6d,
      cherryPink: 0xff9cc0,
      cherryLight: 0xffd1df,
      cherryDeep: 0xe36d91,
      cherryWhite: 0xfff4f8,
      trunk: 0x8a5638,
      trunkDark: 0x5e3a25,
      leaf1: 0x3c8b4a,
      leaf2: 0x519d55,
      leaf3: 0x2d6e3d,
      yellow: 0xffd64f,
      white: 0xfff7e8,
      purple: 0xb46de0,
      blue: 0x5c9de6,
      orange: 0xf08a3c,
      dark: 0x2e3038
    };

    // ------------------------------------------------------------------
    // Ground / garden base
    // ------------------------------------------------------------------
    addBox(0, -0.18, 0, 31, 0.35, 31, PAL.dirt, { roughness: 0.9 });

    // Grass voxel field
    const grassStep = 0.5;
    const grassHalf = 14.5;

    for (let x = -grassHalf; x <= grassHalf; x += grassStep) {
      for (let z = -grassHalf; z <= grassHalf; z += grassStep) {
        if (Math.random() < 0.08) continue;

        const dist = Math.sqrt(x * x + z * z);
        const height = 0.12 + Math.random() * 0.1 + (dist < 4 ? 0.03 : 0);
        const shade = Math.random();
        let color = PAL.grass1;

        if (shade > 0.72) color = PAL.grass3;
        else if (shade > 0.48) color = PAL.grass2;
        else if (shade < 0.18) color = PAL.grass4;

        addBox(
          x + (Math.random() - 0.5) * 0.08,
          height / 2,
          z + (Math.random() - 0.5) * 0.08,
          0.48,
          height,
          0.48,
          color
        );
      }
    }

    // Raised grassy mounds
    function mound(cx, cz, radius, height, color) {
      for (let x = -radius; x <= radius; x += 0.5) {
        for (let z = -radius; z <= radius; z += 0.5) {
          const d = Math.sqrt(x * x + z * z);
          if (d > radius) continue;
          const h = (1 - d / radius) * height + 0.08;
          addBox(cx + x, h / 2, cz + z, 0.52, h, 0.52, color);
        }
      }
    }

    mound(-7, 7, 2.1, 0.42, PAL.grass2);
    mound(8.5, -7.5, 1.8, 0.32, PAL.grass3);
    mound(-9, -7, 2.0, 0.35, PAL.grass4);

    // ------------------------------------------------------------------
    // Winding stone path
    // ------------------------------------------------------------------
    const pathCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-6.5, 0.28, 12.4),
      new THREE.Vector3(-4.2, 0.30, 9.6),
      new THREE.Vector3(-2.3, 0.31, 7.2),
      new THREE.Vector3(-1.1, 0.32, 4.8),
      new THREE.Vector3(0.2, 0.33, 3.0),
      new THREE.Vector3(1.4, 0.34, 1.6)
    ]);

    const pathSamples = 90;

    for (let i = 0; i < pathSamples; i++) {
      const t = i / (pathSamples - 1);
      const p = pathCurve.getPoint(t);
      const tangent = pathCurve.getTangent(t);
      const side = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

      for (let j = -1; j <= 1; j++) {
        const x = p.x + side.x * j * 0.36;
        const z = p.z + side.z * j * 0.36;
        const color = Math.random() > 0.65 ? PAL.path : PAL.pathDark;
        addBox(
          x + (Math.random() - 0.5) * 0.1,
          0.24 + Math.random() * 0.03,
          z + (Math.random() - 0.5) * 0.1,
          0.44,
          0.16,
          0.44,
          color
        );
      }
    }

    // Larger stepping stones
    [
      [-4.9, 10.8, 0.65], [-3.4, 8.2, 0.58], [-2.3, 6.1, 0.55],
      [-0.8, 4.1, 0.58], [0.5, 2.6, 0.65], [1.2, 1.4, 0.55]
    ].forEach(([x, z, r]) => {
      addBox(x, 0.32, z, r * 1.75, 0.20, r * 1.25, PAL.path, { roughness: 0.85 });
      addBox(x + r * 0.25, 0.31, z - r * 0.08, r * 0.9, 0.16, r * 0.6, PAL.stoneLight);
    });

    // ------------------------------------------------------------------
    // Pond, rocks, lotus
    // ------------------------------------------------------------------
    const pondCenter = new THREE.Vector3(7.2, 0.16, 6.6);
    const pondRadius = 3.2;

    for (let x = -pondRadius; x <= pondRadius; x += 0.5) {
      for (let z = -pondRadius; z <= pondRadius; z += 0.5) {
        const d = Math.sqrt(x * x + z * z);
        if (d > pondRadius) continue;

        const edge = d / pondRadius;
        let color = PAL.water;
        if (edge < 0.55) color = PAL.waterDeep;
        else if (Math.random() > 0.65) color = PAL.waterLight;

        addBox(
          pondCenter.x + x,
          0.12 + Math.random() * 0.05,
          pondCenter.z + z,
          0.48,
          0.12,
          0.48,
          color,
          { roughness: 0.35, metalness: 0.15 }
        );
      }
    }

    // Pond stone border
    for (let a = 0; a < Math.PI * 2; a += 0.18) {
      const r = pondRadius + 0.18;
      const x = pondCenter.x + Math.cos(a) * r;
      const z = pondCenter.z + Math.sin(a) * r;
      addBox(x, 0.24, z, 0.44, 0.25, 0.44, Math.random() > 0.5 ? PAL.stone : PAL.stoneDark);
    }

    // Lily pads
    const lilyPositions = [
      [6.2, 6.1], [7.8, 5.7], [6.7, 7.5], [8.4, 7.0], [5.6, 7.9]
    ];

    lilyPositions.forEach(([x, z]) => {
      addBox(x, 0.26, z, 0.55, 0.08, 0.55, PAL.leaf3);
      addBox(x - 0.24, 0.27, z + 0.08, 0.24, 0.09, 0.24, PAL.leaf1);
      addBox(x + 0.25, 0.27, z - 0.1, 0.22, 0.09, 0.22, PAL.leaf2);
    });

    // Lotuses
    function lotus(x, z, color) {
      addBox(x, 0.34, z, 0.16, 0.15, 0.16, color);
      addBox(x - 0.18, 0.34, z, 0.18, 0.10, 0.18, PAL.cherryLight);
      addBox(x + 0.18, 0.34, z, 0.18, 0.10, 0.18, PAL.cherryLight);
      addBox(x, 0.34, z - 0.18, 0.18, 0.10, 0.18, PAL.cherryLight);
      addBox(x, 0.34, z + 0.18, 0.18, 0.10, 0.18, PAL.cherryLight);
      addBox(x, 0.42, z, 0.11, 0.12, 0.11, PAL.yellow);
    }

    lotus(6.6, 6.9, PAL.cherryPink);
    lotus(8.0, 6.2, PAL.cherryWhite);
    lotus(7.0, 5.2, PAL.purple);

    // ------------------------------------------------------------------
    // Pagoda
    // ------------------------------------------------------------------
    function buildTier(yBase, half, bodyH, roofColor, roofLight, roofDark, roofSize) {
      const bodySize = half * 2;

      // Stone/cream base band
      addBox(0, yBase + 0.12, 0, bodySize + 0.35, 0.22, bodySize + 0.35, PAL.cream, { roughness: 0.8 });
      addBox(0, yBase + 0.26, 0, bodySize + 0.28, 0.16, bodySize + 0.28, PAL.gold, { metalness: 0.25 });

      // Main body panels
      const panelH = bodyH - 0.35;
      const panelY = yBase + 0.38 + panelH / 2;

      addBox(0, panelY, half, bodySize - 0.55, panelH, 0.22, PAL.cream, { roughness: 0.75 });
      addBox(0, panelY, -half, bodySize - 0.55, panelH, 0.22, PAL.cream, { roughness: 0.75 });
      addBox(half, panelY, 0, 0.22, panelH, bodySize - 0.55, PAL.cream, { roughness: 0.75 });
      addBox(-half, panelY, 0, 0.22, panelH, bodySize - 0.55, PAL.cream, { roughness: 0.75 });

      // Red corner pillars
      const pillarX = half - 0.18;
      for (const x of [-pillarX, pillarX]) {
        for (const z of [-pillarX, pillarX]) {
          addBox(x, yBase + bodyH / 2 + 0.15, z, 0.34, bodyH - 0.2, 0.34, PAL.red, { roughness: 0.65 });
          addBox(x, yBase + 0.42, z, 0.42, 0.18, 0.42, PAL.redDark);
          addBox(x, yBase + bodyH - 0.25, z, 0.42, 0.18, 0.42, PAL.gold, { metalness: 0.35 });
        }
      }

      // Decorative vertical trim
      for (let i = -Math.floor(bodySize / 2) + 2; i <= Math.floor(bodySize / 2) - 2; i += 2) {
        addBox(i, panelY, half + 0.13, 0.14, panelH - 0.25, 0.08, PAL.gold, { metalness: 0.3 });
        addBox(i, panelY, -half - 0.13, 0.14, panelH - 0.25, 0.08, PAL.gold, { metalness: 0.3 });
      }

      // Front doorway
      if (half > 1.25) {
        addBox(0, yBase + bodyH * 0.44, half + 0.16, 1.15, 1.0, 0.06, PAL.redDark);
        addBox(0, yBase + bodyH * 0.44, half + 0.21, 0.85, 0.72, 0.04, PAL.gold, { metalness: 0.35 });
        addBox(0, yBase + bodyH * 0.44, half + 0.24, 0.55, 0.44, 0.035, 0x2b1b12);
      }

      // Horizontal gold bands around body
      addBox(0, yBase + 0.48, half + 0.14, bodySize - 0.5, 0.12, 0.08, PAL.gold, { metalness: 0.35 });
      addBox(0, yBase + bodyH - 0.18, half + 0.14, bodySize - 0.5, 0.12, 0.08, PAL.gold, { metalness: 0.35 });

      // Roof underside
      const roofY = yBase + bodyH + 0.22;
      addBox(0, roofY + 0.04, 0, roofSize, 0.18, roofSize, PAL.redDark, { roughness: 0.7 });
      addBox(0, roofY + 0.16, 0, roofSize * 1.02, 0.18, roofSize * 1.02, roofColor, { roughness: 0.72 });

      // Stepped roof layers
      addBox(0, roofY + 0.34, 0, roofSize * 0.92, 0.20, roofSize * 0.92, roofColor, { roughness: 0.68 });
      addBox(0, roofY + 0.54, 0, roofSize * 0.78, 0.22, roofSize * 0.78, roofLight, { roughness: 0.66 });
      addBox(0, roofY + 0.74, 0, roofSize * 0.62, 0.20, roofSize * 0.62, roofColor, { roughness: 0.7 });
      addBox(0, roofY + 0.92, 0, roofSize * 0.44, 0.18, roofSize * 0.44, roofDark, { roughness: 0.76 });
      addBox(0, roofY + 1.06, 0, roofSize * 0.24, 0.16, roofSize * 0.24, roofLight, { roughness: 0.65 });

      // Eave edge trim
      addBox(0, roofY + 0.12, roofSize * 0.5, roofSize * 0.95, 0.10, 0.08, PAL.gold, { metalness: 0.45 });
      addBox(0, roofY + 0.12, -roofSize * 0.5, roofSize * 0.95, 0.10, 0.08, PAL.gold, { metalness: 0.45 });
      addBox(roofSize * 0.5, roofY + 0.12, 0, 0.08, 0.10, roofSize * 0.95, PAL.gold, { metalness: 0.45 });
      addBox(-roofSize * 0.5, roofY + 0.12, 0, 0.08, 0.10, roofSize * 0.95, PAL.gold, { metalness: 0.45 });

      // Upturned roof corners and gold ornaments
      const s = roofSize / 2;
      for (const sx of [-1, 1]) {
        for (const sz of [-1, 1]) {
          addBox(sx * (s + 0.28), roofY + 0.42, sz * (s + 0.28), 0.48, 0.34, 0.48, roofColor);
          addBox(sx * (s + 0.52), roofY + 0.62, sz * (s + 0.52), 0.36, 0.26, 0.36, roofLight);
          addBox(sx * (s + 0.66), roofY + 0.82, sz * (s + 0.66), 0.24, 0.20, 0.24, PAL.gold, { metalness: 0.45 });
          addBox(sx * (s + 0.75), roofY + 1.03, sz * (s + 0.75), 0.14, 0.16, 0.14, PAL.goldLight, {
            metalness: 0.35,
            emissive: 0x4a2e00,
            emissiveIntensity: 0.15
          });

          // Hanging ornament
          addBox(sx * (s + 0.7), roofY + 0.28, sz * (s + 0.7), 0.09, 0.24, 0.09, PAL.gold, { metalness: 0.55 });
          addBox(sx * (s + 0.7), roofY + 0.12, sz * (s + 0.7), 0.16, 0.12, 0.16, PAL.red);
        }
      }

      // Roof tile accents
      for (let i = -roofSize * 0.35; i <= roofSize * 0.35; i += 0.55) {
        addBox(i, roofY + 0.62, roofSize * 0.3, 0.24, 0.09, 0.30, PAL.goldLight, { metalness: 0.3 });
        addBox(i, roofY + 0.62, -roofSize * 0.3, 0.24, 0.09, 0.30, PAL.goldLight, { metalness: 0.3 });
      }

      return roofY + 1.08;
    }

    // Base platform and steps
    addBox(0, 0.48, 0, 7.2, 0.55, 7.2, PAL.stone, { roughness: 0.9 });
    addBox(0, 0.78, 0, 6.6, 0.28, 6.6, PAL.stoneLight, { roughness: 0.85 });
    addBox(0, 0.98, 0, 5.8, 0.22, 5.8, PAL.stoneDark, { roughness: 0.9 });

    // Pagoda tiers
    let pagodaTop = 1.0;
    const tiers = [
      { half: 2.65, bodyH: 2.0, roofSize: 6.4 },
      { half: 2.18, bodyH: 1.62, roofSize: 5.3 },
      { half: 1.78, bodyH: 1.38, roofSize: 4.35 },
      { half: 1.42, bodyH: 1.16, roofSize: 3.55 },
      { half: 1.08, bodyH: 0.95, roofSize: 2.85 }
    ];

    tiers.forEach((tier, index) => {
      const yBase = pagodaTop + 0.15;
      pagodaTop = buildTier(
        yBase,
        tier.half,
        tier.bodyH,
        PAL.roofGreen,
        PAL.roofLight,
        PAL.roofDark,
        tier.roofSize
      );

      // Small gold band between tiers
      addBox(0, pagodaTop + 0.08, 0, tier.half * 2 + 0.2, 0.16, tier.half * 2 + 0.2, PAL.gold, { metalness: 0.32 });
    });

    // Finial spire
    addBox(0, pagodaTop + 0.28, 0, 0.55, 0.55, 0.55, PAL.gold, { metalness: 0.45 });
    addBox(0, pagodaTop + 0.72, 0, 0.38, 0.55, 0.38, PAL.goldLight, { metalness: 0.4 });
    addBox(0, pagodaTop + 1.05, 0, 0.28, 0.42, 0.28, PAL.gold, { metalness: 0.45 });
    addBox(0, pagodaTop + 1.42, 0, 0.18, 0.48, 0.18, PAL.goldLight, { metalness: 0.4 });
    addBox(0, pagodaTop + 1.74, 0, 0.16, 0.16, 0.16, PAL.goldLight, {
      emissive: 0xffb23d,
      emissiveIntensity: 0.25
    });

    // Tiny pagoda lanterns hanging near lower roof corners
    [
      [-2.8, 2.4, -2.8], [2.8, 2.4, -2.8], [-2.8, 2.4, 2.8], [2.8, 2.4, 2.8]
    ].forEach(([x, y, z]) => {
      addBox(x, y + 0.32, z, 0.06, 0.22, 0.06, PAL.dark);
      addBox(x, y + 0.12, z, 0.26, 0.26, 0.26, PAL.red);
      addBox(x, y + 0.12, z, 0.16, 0.16, 0.16, PAL.goldLight, {
        emissive: 0xff7d2a,
        emissiveIntensity: 0.7
      });
    });

    // ------------------------------------------------------------------
    // Cherry trees and green trees
    // ------------------------------------------------------------------
    function addLineVoxels(a, b, thickness, color, step = 0.45) {
      const dir = new THREE.Vector3().subVectors(b, a);
      const len = dir.length();
      dir.normalize();

      for (let d = 0; d <= len; d += step) {
        const p = a.clone().addScaledVector(dir, d);
        addBox(
          p.x,
          p.y,
          p.z,
          thickness * (1 - d / len * 0.25),
          thickness * (1 - d / len * 0.25),
          thickness * (1 - d / len * 0.25),
          color,
          { roughness: 0.9 }
        );
      }
    }

    function cherryCluster(cx, cy, cz, radius, amount, seed = 0) {
      const colors = [PAL.cherryPink, PAL.cherryLight, PAL.cherryDeep, PAL.cherryWhite];

      for (let i = 0; i < amount; i++) {
        const a = Math.random() * Math.PI * 2;
        const b = Math.random() * Math.PI * 2;
        const r = Math.sqrt(Math.random()) * radius;

        const x = cx + Math.cos(a) * r;
        const y = cy + (Math.random() - 0.5) * radius * 1.15;
        const z = cz + Math.sin(b) * r;

        const size = 0.18 + Math.random() * 0.22;
        addBox(
          x,
          y,
          z,
          size,
          size * (0.75 + Math.random() * 0.5),
          size,
          colors[Math.floor(Math.random() * colors.length)],
          { roughness: 0.82 }
        );
      }
    }

    function buildCherryTree(cx, cz, scale = 1, seed = 1) {
      // Main trunk
      const trunkHeight = 3.2 * scale;
      addLineVoxels(
        new THREE.Vector3(cx, 0.35, cz),
        new THREE.Vector3(cx + 0.15 * scale, trunkHeight, cz - 0.1 * scale),
        0.44 * scale,
        PAL.trunk
      );

      // Thicker lower trunk
      addBox(cx, 0.65 * scale, cz, 0.62 * scale, 0.8 * scale, 0.62 * scale, PAL.trunk, { roughness: 0.9 });
      addBox(cx + 0.12 * scale, 1.5 * scale, cz - 0.08 * scale, 0.46 * scale, 1.0 * scale, 0.46 * scale, PAL.trunkDark, { roughness: 0.9 });

      // Main branches
      const branchStarts = [
        [cx, 2.25 * scale, cz],
        [cx, 2.75 * scale, cz],
        [cx, 3.0 * scale, cz]
      ];

      const branchEnds = [
        [cx - 1.9 * scale, 3.4 * scale, cz - 0.9 * scale],
        [cx + 1.8 * scale, 3.6 * scale, cz - 0.7 * scale],
        [cx - 1.2 * scale, 4.0 * scale, cz + 1.5 * scale],
        [cx + 1.5 * scale, 3.8 * scale, cz + 1.3 * scale],
        [cx + 0.1 * scale, 4.35 * scale, cz - 0.2 * scale],
        [cx - 0.8 * scale, 4.2 * scale, cz - 1.4 * scale]
      ];

      branchEnds.forEach((end, i) => {
        const start = new THREE.Vector3(
          cx + (i % 2 ? 0.1 : -0.1) * scale,
          branchStarts[i % branchStarts.length][1],
          cz
        );
        const endVec = new THREE.Vector3(end[0], end[1], end[2]);
        addLineVoxels(start, endVec, 0.25 * scale, i % 2 ? PAL.trunk : PAL.trunkDark);
        cherryCluster(endVec.x, endVec.y, endVec.z, 0.72 * scale, 36, seed + i);
      });

      // Extra inner blossom clusters
      cherryCluster(cx - 1.0 * scale, 3.0 * scale, cz - 0.8 * scale, 0.55 * scale, 22, seed + 9);
      cherryCluster(cx + 1.0 * scale, 3.1 * scale, cz + 0.6 * scale, 0.55 * scale, 22, seed + 10);
    }

    buildCherryTree(-7.4, -4.2, 1.25, 1);
    buildCherryTree(7.6, -4.8, 1.15, 2);
    buildCherryTree(-8.2, 5.2, 1.05, 3);
    buildCherryTree(8.8, 8.2, 1.1, 4);
    buildCherryTree(-2.8, -8.8, 0.95, 5);

    // Green trees / bushes
    function greenTree(cx, cz, scale = 1, seed = 1) {
      addLineVoxels(
        new THREE.Vector3(cx, 0.3, cz),
        new THREE.Vector3(cx, 2.8 * scale, cz),
        0.34 * scale,
        PAL.trunkDark
      );

      const layerColors = [PAL.leaf1, PAL.leaf2, PAL.leaf3];

      for (let i = 0; i < 3; i++) {
        const cy = 2.0 * scale + i * 0.65 * scale;
        for (let j = 0; j < 18; j++) {
          const a = Math.random() * Math.PI * 2;
          const r = (0.55 + Math.random() * 0.65) * scale;
          const x = cx + Math.cos(a) * r;
          const z = cz + Math.sin(a) * r;
          const s = (0.25 + Math.random() * 0.35) * scale;
          addBox(x, cy + (Math.random() - 0.5) * 0.45 * scale, z, s, s, s, layerColors[Math.floor(Math.random() * layerColors.length)]);
        }
      }
    }

    greenTree(-10.5, -1.5, 1.0);
    greenTree(10.8, -2.2, 1.0);
    greenTree(-11.5, 8.5, 0.9);
    greenTree(11.2, 4.8, 0.85);
    greenTree(3.5, -10.2, 1.1);

    // Decorative shrubs
    function bush(cx, cz, radius, height, color) {
      for (let i = 0; i < 28; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = Math.sqrt(Math.random()) * radius;
        const x = cx + Math.cos(a) * r;
        const z = cz + Math.sin(a) * r;
        const s = 0.25 + Math.random() * 0.35;
        addBox(x, height + Math.random() * 0.25, z, s, s, s, color);
      }
    }

    bush(-4.2, 4.8, 1.25, 0.45, PAL.leaf3);
    bush(4.8, 4.9, 1.0, 0.4, PAL.leaf1);
    bush(-5.6, -2.0, 0.9, 0.36, PAL.leaf2);
    bush(5.6, -2.5, 0.9, 0.34, PAL.leaf1);
    bush(-2.0, 8.8, 1.0, 0.38, PAL.leaf2);
    bush(8.0, 9.7, 1.1, 0.42, PAL.leaf3);

    // ------------------------------------------------------------------
    // Flowers
    // ------------------------------------------------------------------
    function flower(x, z, stemColor, petalColor, scale = 1) {
      addBox(x, 0.35, z, 0.07 * scale, 0.45 * scale, 0.07 * scale, stemColor);
      addBox(x, 0.68 * scale, z, 0.13 * scale, 0.12 * scale, 0.13 * scale, PAL.yellow);

      for (let i = 0; i < 4; i++) {
        const a = Math.PI * 0.5 * i + Math.PI * 0.25;
        const px = x + Math.cos(a) * 0.16 * scale;
        const pz = z + Math.sin(a) * 0.16 * scale;
        addBox(px, 0.66 * scale, pz, 0.14 * scale, 0.10 * scale, 0.14 * scale, petalColor);
      }
    }

    const flowerPositions = [
      [-3.4, 7.8], [-2.8, 8.4], [-4.2, 8.8], [2.8, 6.2], [3.8, 7.1],
      [4.9, 2.8], [5.8, 1.8], [-5.0, 1.3], [-6.1, 2.4], [-5.8, 9.5],
      [9.0, 2.6], [9.6, 3.5], [10.2, 9.3], [-9.8, 5.8], [-8.8, 7.8],
      [1.8, 10.8], [0.4, 11.7], [-1.0, 11.2], [6.4, 10.2], [7.6, 10.6]
    ];

    flowerPositions.forEach(([x, z], i) => {
      const colors = [PAL.cherryPink, PAL.yellow, PAL.purple, PAL.white, PAL.blue, PAL.orange];
      flower(x, z, PAL.leaf1, colors[i % colors.length], 0.9 + Math.random() * 0.35);
    });

    // Small flower patches
    for (let i = 0; i < 34; i++) {
      const x = (Math.random() - 0.5) * 24;
      const z = (Math.random() - 0.5) * 24;
      if (Math.sqrt(x * x + z * z) < 4.2) continue;
      const colors = [PAL.cherryPink, PAL.yellow, PAL.white, PAL.purple, PAL.blue, PAL.orange];
      flower(x, z, PAL.leaf2, colors[Math.floor(Math.random() * colors.length)], 0.55 + Math.random() * 0.35);
    }

    // ------------------------------------------------------------------
    // Stone lanterns
    // ------------------------------------------------------------------
    function stoneLantern(x, z, scale = 1) {
      const baseY = 0.25;

      addBox(x, baseY, z, 0.7 * scale, 0.26 * scale, 0.7 * scale, PAL.stoneDark, { roughness: 0.9 });
      addBox(x, baseY + 0.26 * scale, z, 0.55 * scale, 0.22 * scale, 0.55 * scale, PAL.stone, { roughness: 0.88 });
      addBox(x, baseY + 0.78 * scale, z, 0.28 * scale, 1.0 * scale, 0.28 * scale, PAL.stoneDark, { roughness: 0.9 });

      // Light housing
      addBox(x, baseY + 1.38 * scale, z, 0.58 * scale, 0.48 * scale, 0.58 * scale, PAL.stoneDark, { roughness: 0.85 });
      addBox(x, baseY + 1.38 * scale, z, 0.40 * scale, 0.36 * scale, 0.40 * scale, PAL.goldLight, {
        emissive: 0xffb33c,
        emissiveIntensity: 1.1
      });

      // Roof cap
      addBox(x, baseY + 1.72 * scale, z, 0.76 * scale, 0.14 * scale, 0.76 * scale, PAL.stone, { roughness: 0.8 });
      addBox(x, baseY + 1.88 * scale, z, 0.44 * scale, 0.22 * scale, 0.44 * scale, PAL.stoneDark);
      addBox(x, baseY + 2.02 * scale, z, 0.22 * scale, 0.18 * scale, 0.22 * scale, PAL.gold, { metalness: 0.3 });

      const light = new THREE.PointLight(0xffb24c, 2.2 * scale, 4.5 * scale, 2);
      light.position.set(x, baseY + 1.38 * scale, z);
      scene.add(light);
    }

    stoneLantern(-4.8, 4.0, 1.0);
    stoneLantern(4.6, 6.4, 1.1);
    stoneLantern(-2.8, 10.4, 0.85);
    stoneLantern(9.6, 3.0, 0.9);

    // ------------------------------------------------------------------
    // Distant hills / mountains
    // ------------------------------------------------------------------
    function hill(cx, cz, width, height, color) {
      for (let x = -width; x <= width; x += 0.6) {
        const t = Math.abs(x) / width;
        const h = (1 - t * t) * height;
        addBox(cx + x, h / 2, cz, 0.55, h, 1.3, color);
      }
    }

    hill(-12, -14, 4.5, 4.0, 0x416a55);
    hill(0, -16, 5.0, 3.3, 0x365e4e);
    hill(12, -14, 4.0, 3.8, 0x49765b);
    hill(-14, -10, 3.0, 2.8, 0x3e6e58);
    hill(14, -10, 3.2, 3.1, 0x416a55);

    // Low mist clouds / voxel clouds
    function cloud(cx, cy, cz, scale = 1) {
      const colors = [0xffffff, 0xe9f4ff, 0xd6ecff];
      for (let i = 0; i < 18; i++) {
        const x = cx + (Math.random() - 0.5) * 3.2 * scale;
        const y = cy + (Math.random() - 0.5) * 0.8 * scale;
        const z = cz + (Math.random() - 0.5) * 1.4 * scale;
        const s = (0.35 + Math.random() * 0.5) * scale;
        addBox(x, y, z, s, s * 0.65, s, colors[Math.floor(Math.random() * colors.length)], {
          roughness: 1,
          emissive: 0x223344,
          emissiveIntensity: 0.04
        });
      }
    }

    cloud(-8, 12.5, -8, 1.0);
    cloud(7, 13.2, -9, 0.85);
    cloud(-13, 14.0, 5, 0.75);
    cloud(12, 15.0, 1, 0.65);
    cloud(2, 16.0, -14, 0.8);

    // Sun disk / warm glow voxels
    addBox(-14, 15.5, -17, 1.3, 1.3, 0.18, PAL.goldLight, {
      emissive: 0xffb34d,
      emissiveIntensity: 0.65,
      roughness: 0.4
    });
    addBox(-14, 15.5, -17.1, 2.2, 2.2, 0.08, 0xffcf7a, {
      emissive: 0xffb34d,
      emissiveIntensity: 0.25
    });

    // Small voxel birds
    function bird(x, y, z, color) {
      addBox(x, y, z, 0.28, 0.12, 0.12, color);
      addBox(x - 0.2, y + 0.08, z, 0.18, 0.08, 0.08, color);
      addBox(x + 0.22, y + 0.06, z, 0.16, 0.08, 0.08, color);
      addBox(x + 0.16, y + 0.16, z + 0.08, 0.08, 0.08, 0.08, color);
    }

    bird(-5.4, 11.8, -2.0, 0x4a4a55);
    bird(6.2, 10.6, 4.5, 0x4a4a55);
    bird(-10.2, 9.8, 4.0, 0x4a4a55);

    // Commit static voxels
    commitVoxels();

    // ------------------------------------------------------------------
    // Falling cherry blossom petals
    // ------------------------------------------------------------------
    const petalCount = 170;
    const petalGeometry = new THREE.BoxGeometry(1, 1, 1);
    const petalMaterial = new THREE.MeshStandardMaterial({
      color: PAL.cherryPink,
      roughness: 0.75,
      emissive: 0x7a2e42,
      emissiveIntensity: 0.08
    });

    const petals = new THREE.InstancedMesh(petalGeometry, petalMaterial, petalCount);
    petals.castShadow = true;
    petals.receiveShadow = false;
    scene.add(petals);

    const petalData = [];

    for (let i = 0; i < petalCount; i++) {
      const treeCenters = [
        [-7.4, -4.2],
        [7.6, -4.8],
        [-8.2, 5.2],
        [8.8, 8.2],
        [-2.8, -8.8]
      ];
      const t = treeCenters[Math.floor(Math.random() * treeCenters.length)];

      petalData.push({
        baseX: t[0] + (Math.random() - 0.5) * 4.6,
        baseZ: t[1] + (Math.random() - 0.5) * 4.6,
        x: t[0] + (Math.random() - 0.5) * 4.6,
        y: 3.2 + Math.random() * 5.0,
        z: t[1] + (Math.random() - 0.5) * 4.6,
        speed: 0.45 + Math.random() * 0.75,
        drift: 0.4 + Math.random() * 0.75,
        phase: Math.random() * Math.PI * 2,
        size: 0.06 + Math.random() * 0.09,
        twist: Math.random() * Math.PI
      });
    }

    const petalMatrix = new THREE.Matrix4();
    const petalQuat = new THREE.Quaternion();
    const petalPos = new THREE.Vector3();
    const petalScale = new THREE.Vector3();

    function updatePetals(time) {
      for (let i = 0; i < petalCount; i++) {
        const p = petalData[i];

        p.y -= p.speed * 0.016;
        p.x += Math.sin(time * 0.9 + p.phase) * p.drift * 0.012;
        p.z += Math.cos(time * 0.75 + p.phase) * p.drift * 0.012;

        if (p.y < 0.2) {
          p.y = 7.5 + Math.random() * 3.0;
          p.x = p.baseX + (Math.random() - 0.5) * 3.5;
          p.z = p.baseZ + (Math.random() - 0.5) * 3.5;
        }

        petalPos.set(p.x, p.y, p.z);
        petalQuat.setFromEuler(
          new THREE.Euler(
            Math.sin(time * 0.6 + p.phase) * 0.8,
            time * 0.5 + p.twist,
            Math.cos(time * 0.7 + p.phase) * 0.7
          )
        );
        petalScale.set(p.size, p.size * 0.55, p.size);
        petalMatrix.compose(petalPos, petalQuat, petalScale);
        petals.setMatrixAt(i, petalMatrix);
      }

      petals.instanceMatrix.needsUpdate = true;
    }

    // ------------------------------------------------------------------
    // Fireflies / floating glow points
    // ------------------------------------------------------------------
    const fireflyCount = 34;
    const fireflyGeometry = new THREE.BoxGeometry(1, 1, 1);
    const fireflyMaterial = new THREE.MeshStandardMaterial({
      color: PAL.goldLight,
      emissive: 0xffb65a,
      emissiveIntensity: 1.4,
      roughness: 0.4
    });

    const fireflies = new THREE.InstancedMesh(fireflyGeometry, fireflyMaterial, fireflyCount);
    scene.add(fireflies);

    const fireflyData = [];

    for (let i = 0; i < fireflyCount; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = 4.5 + Math.random() * 8.0;
      fireflyData.push({
        x: Math.cos(a) * r,
        y: 1.2 + Math.random() * 6.0,
        z: Math.sin(a) * r,
        phase: Math.random() * Math.PI * 2,
        radius: 0.55 + Math.random() * 0.45,
        speed: 0.6 + Math.random() * 0.9
      });
    }

    const flyMatrix = new THREE.Matrix4();
    const flyPos = new THREE.Vector3();
    const flyScale = new THREE.Vector3();

    function updateFireflies(time) {
      for (let i = 0; i < fireflyCount; i++) {
        const f = fireflyData[i];
        flyPos.set(
          f.x + Math.sin(time * f.speed + f.phase) * 0.55,
          f.y + Math.sin(time * 0.7 + f.phase) * 0.35,
          f.z + Math.cos(time * f.speed + f.phase) * 0.55
        );
        const s = f.radius * 0.09;
        flyScale.set(s, s, s);
        flyMatrix.compose(flyPos, new THREE.Quaternion(), flyScale);
        fireflies.setMatrixAt(i, flyMatrix);
      }

      fireflies.instanceMatrix.needsUpdate = true;
    }

    // ------------------------------------------------------------------
    // Animate
    // ------------------------------------------------------------------
    const clock = new THREE.Clock();

    function animate() {
      const elapsed = clock.getElapsedTime();

      controls.update();
      updatePetals(elapsed);
      updateFireflies(elapsed);

      // Gentle light shimmer
      const glow = 0.9 + Math.sin(elapsed * 1.4) * 0.15;
      fireflyMaterial.emissiveIntensity = 1.2 + glow * 0.3;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();

    // ------------------------------------------------------------------
    // Resize
    // ------------------------------------------------------------------
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
