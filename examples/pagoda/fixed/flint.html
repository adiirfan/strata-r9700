<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🍁 Voxel Pagoda Garden</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #87CEEB;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="info">✦ Voxel Garden ✦</div>
    <script>
        // ===== SCENE SETUP =====
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 30, 60);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(38, 26, 42);
        camera.lookAt(0, 6, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // ===== LIGHTS =====
        const ambientLight = new THREE.AmbientLight(0x404040, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xFFF5E6, 0.95);
        dirLight.position.set(30, 45, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 60;
        dirLight.shadow.camera.left = -20;
        dirLight.shadow.camera.right = 20;
        dirLight.shadow.camera.top = 30;
        dirLight.shadow.camera.bottom = -10;
        scene.add(dirLight);
        const hemi = new THREE.HemisphereLight(0xADD8E6, 0x228B22, 0.55);
        scene.add(hemi);

        // ===== MATERIALS =====
        const brickMat = new THREE.MeshLambertMaterial({ color: 0xC0392B });
        const brickDarkMat = new THREE.MeshLambertMaterial({ color: 0xA93226 });
        const roofMat = new THREE.MeshLambertMaterial({ color: 0x2C3E50 });
        const goldMat = new THREE.MeshLambertMaterial({ color: 0xF39C12, emissive: 0xB9770E, emissiveIntensity: 0.3 });
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x7DCEA0 });
        const pathMat = new THREE.MeshLambertMaterial({ color: 0xD4C19A });
        const waterMat = new THREE.MeshLambertMaterial({ color: 0x2E86C1, transparent: true, opacity: 0.85 });
        const trunkMat = new THREE.MeshLambertMaterial({ color: 0x6D4C41 });
        const leafMat = new THREE.MeshLambertMaterial({ color: 0x4CAF50 });
        const pinkMat = new THREE.MeshLambertMaterial({ color: 0xF8BBD0 });
        const pinkLightMat = new THREE.MeshLambertMaterial({ color: 0xFBCFE8 });
        const whiteMat = new THREE.MeshLambertMaterial({ color: 0xFFF0F5 });
        const rockMat = new THREE.MeshLambertMaterial({ color: 0x95A5A6 });
        const darkRockMat = new THREE.MeshLambertMaterial({ color: 0x7F8C8D });
        const flowerMats = [
            new THREE.MeshLambertMaterial({ color: 0xE74C3C }),
            new THREE.MeshLambertMaterial({ color: 0xF1C40F }),
            new THREE.MeshLambertMaterial({ color: 0x9B59B6 }),
            new THREE.MeshLambertMaterial({ color: 0xE91E63 }),
            new THREE.MeshLambertMaterial({ color: 0xFF6B6B }),
        ];
        const lilyMat = new THREE.MeshLambertMaterial({ color: 0x52BE80 });

        // ===== HELPERS =====
        function createBox(w, h, d, mat, x, y, z, rx = 0, ry = 0, rz = 0) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.rotation.set(rx, ry, rz);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            return mesh;
        }

        function createSphere(r, mat, x, y, z) {
            const geo = new THREE.SphereGeometry(r, 10, 10);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            scene.add(mesh);
            return mesh;
        }

        function createCylinder(r, h, mat, x, y, z) {
            const geo = new THREE.CylinderGeometry(r, r, h, 8);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            scene.add(mesh);
            return mesh;
        }

        // ===== GROUND =====
        createBox(60, 2, 60, groundMat, 0, -1, 0);

        // ===== POND =====
        createBox(12, 0.6, 12, waterMat, 14, -0.3, 10);

        // Lily pads in pond
        for (let i = 0; i < 6; i++) {
            const lx = 10 + Math.random() * 8;
            const lz = 8 + Math.random() * 8;
            createBox(0.8, 0.2, 0.8, lilyMat, lx, 0.05, lz);
        }

        // ===== PATH =====
        createBox(6, 0.3, 1.5, pathMat, -8, 0.15, 8);
        createBox(5, 0.3, 1.5, pathMat, -2, 0.15, 10);
        createBox(4, 0.3, 1.5, pathMat, 2, 0.15, 8);
        createBox(3, 0.3, 1.5, pathMat, 5, 0.15, 9);

        // ===== PAGODAS =====
        // Base platform
        createBox(7, 0.8, 7, brickMat, 0, 0.4, 0);

        // Tier 1: platform 4x4x2.5
        createBox(4, 2.5, 4, brickMat, 0, 0.8 + 1.25, 0);
        // Pillars
        createBox(0.7, 2.5, 0.7, brickDarkMat, -1.65, 0.8 + 1.25, -1.65);
        createBox(0.7, 2.5, 0.7, brickDarkMat, 1.65, 0.8 + 1.25, -1.65);
        createBox(0.7, 2.5, 0.7, brickDarkMat, -1.65, 0.8 + 1.25, 1.65);
        createBox(0.7, 2.5, 0.7, brickDarkMat, 1.65, 0.8 + 1.25, 1.65);

        // Tier 1 roof
        createBox(8.5, 0.4, 8.5, roofMat, 0, 3.3 + 0.2, 0);
        createBox(7.5, 0.3, 7.5, roofMat, 0, 3.5 + 0.15, 0);
        createBox(6.5, 0.2, 6.5, roofMat, 0, 3.65 + 0.1, 0);

        // Tier 2: platform 2x2x2
        createBox(2, 2, 2, brickMat, 0, 3.6 + 1, 0);
        // Pillars
        createBox(0.6, 2, 0.6, brickDarkMat, -0.7, 3.6 + 1, -0.7);
        createBox(0.6, 2, 0.6, brickDarkMat, 0.7, 3.6 + 1, -0.7);
        createBox(0.6, 2, 0.6, brickDarkMat, -0.7, 3.6 + 1, 0.7);
        createBox(0.6, 2, 0.6, brickDarkMat, 0.7, 3.6 + 1, 0.7);

        // Tier 2 roof
        createBox(6, 0.4, 6, roofMat, 0, 5.6 + 0.2, 0);
        createBox(5, 0.3, 5, roofMat, 0, 5.8 + 0.15, 0);
        createBox(4, 0.2, 4, roofMat, 0, 5.95 + 0.1, 0);

        // Tier 3: platform 1x1x1.5
        createBox(1, 1.5, 1, brickMat, 0, 6.0 + 0.75, 0);

        // Tier 3 roof
        createBox(4, 0.4, 4, roofMat, 0, 7.5 + 0.2, 0);
        createBox(3, 0.3, 3, roofMat, 0, 7.7 + 0.15, 0);
        createBox(2, 0.2, 2, roofMat, 0, 7.85 + 0.1, 0);

        // Gold finial
        createCylinder(0.3, 0.8, goldMat, 0, 8.5, 0);
        createSphere(0.35, goldMat, 0, 9.0, 0);

        // Gold trim on roof edges
        createBox(8.6, 0.1, 0.3, goldMat, 0, 3.2, 4.3);
        createBox(8.6, 0.1, 0.3, goldMat, 0, 3.2, -4.3);
        createBox(0.3, 0.1, 8.6, goldMat, 4.3, 3.2, 0);
        createBox(0.3, 0.1, 8.6, goldMat, -4.3, 3.2, 0);

        // ===== CHERRY BLOSSOM TREES =====
        function createCherryTree(x, z, scale = 1) {
            // Trunk
            createBox(0.7 * scale, 2.5 * scale, 0.7 * scale, trunkMat, x, 1.25 * scale, z);
            // Foliage - pink clusters
            const group = new THREE.Group();
            group.position.set(x, 0, z);
            const s = scale;
            const f1 = createSphere(2.2 * s, pinkMat, 0, 3.2 * s, 0);
            const f2 = createSphere(1.8 * s, pinkLightMat, 0.8, 4.2 * s, 0);
            const f3 = createSphere(1.5 * s, pinkMat, -0.8, 4.5 * s, 0);
            const f4 = createSphere(1.2 * s, whiteMat, 0, 5.2 * s, 0);
            const f5 = createSphere(0.9 * s, pinkLightMat, 0, 2.8 * s, 0);
            group.add(f1, f2, f3, f4, f5);
            scene.add(group);
        }

        createCherryTree(-8, -7, 1.0);
        createCherryTree(8, -7, 1.0);
        createCherryTree(-7, 8, 0.9);
        createCherryTree(7, 8, 0.9);

        // ===== REGULAR TREES =====
        function createPineTree(x, z, scale = 1) {
            createBox(0.6 * scale, 2 * scale, 0.6 * scale, trunkMat, x, 1 * scale, z);
            createBox(1.8 * scale, 1.5 * scale, 1.8 * scale, leafMat, x, 2.5 * scale, z);
            createBox(1.2 * scale, 1.2 * scale, 1.2 * scale, leafMat, x, 3.5 * scale, z);
            createBox(0.8 * scale, 0.8 * scale, 0.8 * scale, leafMat, x, 4.3 * scale, z);
        }

        createPineTree(10, 4, 1.2);
        createPineTree(-10, -9, 1.0);
        createPineTree(3, -12, 0.8);
        createPineTree(-3, -12, 0.8);

        // ===== ROCKS =====
        function createRock(x, z, scale = 1) {
            const geo = new THREE.DodecahedronGeometry(0.8 * scale, 0);
            const mesh = new THREE.Mesh(geo, rockMat);
            mesh.position.set(x, 0.4 * scale, z);
            mesh.scale.y = 0.7;
            mesh.castShadow = true;
            scene.add(mesh);
        }

        createRock(5, 5, 1.2);
        createRock(-6, -3, 0.8);
        createRock(8, -12, 0.7);
        createRock(-12, 5, 0.9);

        // ===== FLOWERS =====
        function createFlower(x, z, mat) {
            createBox(0.2, 0.2, 0.2, mat, x, 0.2, z);
            createBox(0.15, 0.15, 0.15, whiteMat, x, 0.35, z);
        }

        createFlower(-4, -2, flowerMats[0]);
        createFlower(-2, -4, flowerMats[1]);
        createFlower(3, -1, flowerMats[2]);
        createFlower(6, -3, flowerMats[3]);
        createFlower(-5, 5, flowerMats[4]);
        createFlower(8, 3, flowerMats[1]);
        createFlower(-9, -5, flowerMats[2]);
        createFlower(11, -2, flowerMats[4]);

        // ===== SKY =====

        // ===== ANIMATION =====
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.005;

            // Gentle camera orbit
            const angle = time * 0.2;
            camera.position.x = 38 + Math.sin(angle) * 8;
            camera.position.z = 42 + Math.cos(angle) * 8;
            camera.lookAt(0, 6, 0);

            // Slight sway of trees
            // (skip for simplicity)

            renderer.render(scene, camera);
        }
        animate();

        // ===== RESIZE =====
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
